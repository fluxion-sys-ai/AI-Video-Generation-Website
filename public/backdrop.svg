<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1322"/><stop offset="1" stop-color="#0C1526"/>
    </linearGradient>
    <radialGradient id="glowA" cx="28%" cy="32%" r="46%">
      <stop offset="0" stop-color="#7CBDF2" stop-opacity="0.18"/><stop offset="1" stop-color="#7CBDF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="55%" r="46%">
      <stop offset="0" stop-color="#9FCBF5" stop-opacity="0.16"/><stop offset="1" stop-color="#9FCBF5" stop-opacity="0"/>
    </radialGradient>
    <!-- lines brighten and whiten toward the right (empty) side -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CBDF2" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#7CBDF2" stop-opacity="0.32"/>
      <stop offset="0.68" stop-color="#BFE0FA" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#EAF4FE" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#glowA)"/>
  <rect width="1440" height="900" fill="url(#glowB)"/>

  <!-- convergence lines (also motion paths) -->
  <g stroke="url(#line)" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path id="l1" d="M0 120 Q 720 450 1440 120"/>
    <path id="l2" d="M0 210 Q 720 450 1440 210" opacity="0.85"/>
    <path id="l3" d="M0 300 Q 720 450 1440 300" opacity="0.7"/>
    <path id="l4" d="M0 450 L 1440 450" opacity="0.9"/>
    <path id="l5" d="M0 600 Q 720 450 1440 600" opacity="0.7"/>
    <path id="l6" d="M0 690 Q 720 450 1440 690" opacity="0.85"/>
    <path id="l7" d="M0 780 Q 720 450 1440 780"/>
  </g>

  <!-- traveling gold packets -->
  <g filter="url(#soft)">
    <g fill="#F5C46B"><circle r="3"/>
      <animateMotion dur="8s" begin="0s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#l1"/></animateMotion></g>
    <g fill="#D9A45E"><circle r="2.6"/>
      <animateMotion dur="9.5s" begin="1.2s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#l2"/></animateMotion></g>
    <g fill="#F5C46B"><circle r="3"/>
      <animateMotion dur="7.5s" begin="2.5s" repeatCount="indefinite" calcMode="linear" keyPoints="1;0" keyTimes="0;1"><mpath xlink:href="#l3"/></animateMotion></g>
    <g fill="#F5C46B"><circle r="3.4"/>
      <animateMotion dur="10s" begin="0.6s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#l4"/></animateMotion></g>
    <g fill="#D9A45E"><circle r="2.6"/>
      <animateMotion dur="8.5s" begin="3s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#l5"/></animateMotion></g>
    <g fill="#F5C46B"><circle r="2.8"/>
      <animateMotion dur="9s" begin="1.8s" repeatCount="indefinite" calcMode="linear" keyPoints="1;0" keyTimes="0;1"><mpath xlink:href="#l6"/></animateMotion></g>
    <g fill="#D9A45E"><circle r="2.8"/>
      <animateMotion dur="11s" begin="0.3s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#l7"/></animateMotion></g>
  </g>

  <!-- video-editing motif: timeline, playhead, keyframes, waveform (right side) -->
  <g transform="translate(860 380)">
    <!-- timeline track -->
    <line x1="0" y1="50" x2="480" y2="50" stroke="#CFE6FB" stroke-width="1" opacity="0.5"/>
    <!-- tick marks -->
    <g stroke="#CFE6FB" stroke-width="1" opacity="0.28">
      <line x1="0"   y1="44" x2="0"   y2="56"/><line x1="48"  y1="46" x2="48"  y2="54"/>
      <line x1="96"  y1="46" x2="96"  y2="54"/><line x1="144" y1="46" x2="144" y2="54"/>
      <line x1="192" y1="46" x2="192" y2="54"/><line x1="240" y1="44" x2="240" y2="56"/>
      <line x1="288" y1="46" x2="288" y2="54"/><line x1="336" y1="46" x2="336" y2="54"/>
      <line x1="384" y1="46" x2="384" y2="54"/><line x1="432" y1="46" x2="432" y2="54"/>
      <line x1="480" y1="44" x2="480" y2="56"/>
    </g>
    <!-- clip blocks on the track -->
    <rect x="40"  y="62" width="150" height="10" rx="3" fill="#7CBDF2" opacity="0.25"/>
    <rect x="210" y="62" width="90"  height="10" rx="3" fill="#9FCBF5" opacity="0.22"/>
    <rect x="320" y="62" width="130" height="10" rx="3" fill="#7CBDF2" opacity="0.2"/>
    <!-- keyframe diamonds (pulsing) -->
    <g fill="#D9A45E">
      <rect x="-4" y="46" width="8" height="8" transform="rotate(45 0 50)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="236" y="46" width="8" height="8" transform="rotate(45 240 50)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></rect>
      <rect x="476" y="46" width="8" height="8" transform="rotate(45 480 50)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></rect>
    </g>
    <!-- audio waveform -->
    <g fill="#9FCBF5" opacity="0.6">
      <rect x="0"   y="-6" width="3" height="12" rx="1.5"><animate attributeName="height" values="6;22;6"  dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="6;-5;6"    dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="8"   y="-6" width="3" height="12" rx="1.5"><animate attributeName="height" values="10;28;10" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="4;-8;4"    dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="16"  y="-6" width="3" height="12" rx="1.5"><animate attributeName="height" values="6;18;6"  dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="6;-3;6"    dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="24"  y="-6" width="3" height="12" rx="1.5"><animate attributeName="height" values="12;30;12" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="3;-9;3"    dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="32"  y="-6" width="3" height="12" rx="1.5"><animate attributeName="height" values="8;20;8"  dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="5;-4;5"    dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="40"  y="-6" width="3" height="12" rx="1.5"><animate attributeName="height" values="6;24;6"  dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="6;-6;6"   dur="1.25s" repeatCount="indefinite"/></rect>
    </g>
    <!-- sweeping playhead -->
    <g>
      <line x1="0" y1="30" x2="0" y2="78" stroke="#EAF4FE" stroke-width="1.5"/>
      <path d="M-5 26 L5 26 L0 34 Z" fill="#F5C46B"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="480 0" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
