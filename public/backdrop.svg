<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- flat solid background, no gradient -->
  <rect width="1440" height="900" fill="#0A1322"/>

  <!-- soft glow on the right (blur of a solid shape, not a gradient) -->
  <ellipse cx="1150" cy="450" rx="150" ry="240" fill="#3E6FA8" opacity="0.35" filter="url(#glow)"/>

  <!-- lines emanate from the text (left) and converge into the video (right) -->
  <g fill="none" stroke-linecap="round">
    <path id="l1" d="M100 150 C 480 210, 820 360, 1150 450"/>
    <path id="l2" d="M100 260 C 480 300, 820 400, 1150 450"/>
    <path id="l3" d="M100 360 C 480 385, 820 425, 1150 450"/>
    <path id="l4" d="M100 450 L 1150 450"/>
    <path id="l5" d="M100 540 C 480 515, 820 475, 1150 450"/>
    <path id="l6" d="M100 640 C 480 600, 820 500, 1150 450"/>
    <path id="l7" d="M100 750 C 480 690, 820 540, 1150 450"/>
  </g>
  <!-- base strokes: faint on the left -->
  <use href="#l1" stroke="#5E92C8" stroke-width="1.1" opacity="0.30"/>
  <use href="#l2" stroke="#5E92C8" stroke-width="1.1" opacity="0.30"/>
  <use href="#l3" stroke="#5E92C8" stroke-width="1.1" opacity="0.30"/>
  <use href="#l4" stroke="#5E92C8" stroke-width="1.1" opacity="0.34"/>
  <use href="#l5" stroke="#5E92C8" stroke-width="1.1" opacity="0.30"/>
  <use href="#l6" stroke="#5E92C8" stroke-width="1.1" opacity="0.30"/>
  <use href="#l7" stroke="#5E92C8" stroke-width="1.1" opacity="0.30"/>
  <!-- brighter overlay: only the right portion, so lines whiten toward the video -->
  <g fill="none" stroke="#DCEBFB" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <path d="M820 360 C 950 400, 1050 432, 1150 450"/>
    <path d="M820 400 C 950 420, 1050 440, 1150 450"/>
    <path d="M820 425 C 950 435, 1050 445, 1150 450"/>
    <path d="M820 450 L 1150 450"/>
    <path d="M820 475 C 950 465, 1050 455, 1150 450"/>
    <path d="M820 500 C 950 480, 1050 460, 1150 450"/>
    <path d="M820 540 C 950 500, 1050 470, 1150 450"/>
  </g>

  <!-- gold dots travel from the text into the video, accelerating (ease-in) as they approach -->
  <g fill="#F5C46B" filter="url(#soft)">
    <g><circle r="3"/><animateMotion dur="5.5s" begin="0s"   repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#l1"/></animateMotion></g>
    <g><circle r="2.6"/><animateMotion dur="6s"  begin="0.9s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#l2"/></animateMotion></g>
    <g><circle r="3"/><animateMotion dur="5s"   begin="1.7s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#l3"/></animateMotion></g>
    <g><circle r="3.4"/><animateMotion dur="6.5s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#l4"/></animateMotion></g>
    <g><circle r="2.8"/><animateMotion dur="5.8s" begin="2.1s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#l5"/></animateMotion></g>
    <g><circle r="2.6"/><animateMotion dur="6.2s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#l6"/></animateMotion></g>
    <g><circle r="3"/><animateMotion dur="7s"   begin="0.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#l7"/></animateMotion></g>
  </g>
</svg>
