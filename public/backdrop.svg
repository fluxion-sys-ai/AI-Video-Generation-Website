<svg width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- dark on the left, lighter + warmer toward the right -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#060A13"/>
      <stop offset="0.45" stop-color="#0D1728"/>
      <stop offset="0.78" stop-color="#1A2A44"/>
      <stop offset="1" stop-color="#2E3552"/>
    </linearGradient>
    <!-- warm wash on the right (the yellower feel) -->
    <radialGradient id="warm" cx="90%" cy="50%" r="55%">
      <stop offset="0" stop-color="#E8B24E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8B24E" stop-opacity="0"/>
    </radialGradient>
    <!-- bright glow for the dots -->
    <filter id="dotglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect width="1440" height="900" fill="url(#warm)"/>

  <!-- converging lines over the gradient (subtle, brighten toward the right) -->
  <g fill="none" stroke="#AECBF0" stroke-width="1" stroke-linecap="round" opacity="0.35">
    <path id="p1" d="M120 160 C 500 220, 840 370, 1240 450"/>
    <path id="p2" d="M120 280 C 500 310, 840 405, 1240 450"/>
    <path id="p3" d="M120 380 C 500 395, 840 428, 1240 450"/>
    <path id="p4" d="M120 470 C 500 460, 840 455, 1240 450"/>
    <path id="p5" d="M120 560 C 500 540, 840 480, 1240 450"/>
    <path id="p6" d="M120 660 C 500 610, 840 500, 1240 450"/>
    <path id="p7" d="M120 760 C 500 700, 840 540, 1240 450"/>
  </g>

  <!-- orange dots: grow + brighten as they accelerate toward the right -->
  <g fill="#FFC15E" filter="url(#dotglow)">
    <g>
      <circle r="3"><animate attributeName="r" values="2;3;5" keyTimes="0;0.6;1" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="5.5s" repeatCount="indefinite"/></circle>
      <animateMotion dur="5.5s" begin="0s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p1"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="2;3;5" keyTimes="0;0.6;1" dur="6.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="6.2s" repeatCount="indefinite"/></circle>
      <animateMotion dur="6.2s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p2"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="2;3;5" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/></circle>
      <animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p3"/></animateMotion>
    </g>
    <g>
      <circle r="3.4"><animate attributeName="r" values="2.4;3.4;5.6" keyTimes="0;0.6;1" dur="6.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.85;1" keyTimes="0;0.6;1" dur="6.6s" repeatCount="indefinite"/></circle>
      <animateMotion dur="6.6s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p4"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="2;3;5" keyTimes="0;0.6;1" dur="5.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="5.8s" repeatCount="indefinite"/></circle>
      <animateMotion dur="5.8s" begin="2.1s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p5"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="2;3;5" keyTimes="0;0.6;1" dur="6.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="6.4s" repeatCount="indefinite"/></circle>
      <animateMotion dur="6.4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p6"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="2;3;5" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/></circle>
      <animateMotion dur="7s" begin="0.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p7"/></animateMotion>
    </g>
  </g>
</svg>
