<svg width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- deep navy, darker; no green tint -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0.12">
      <stop offset="0" stop-color="#04070E"/>
      <stop offset="0.5" stop-color="#080F1E"/>
      <stop offset="1" stop-color="#0E1B34"/>
    </linearGradient>
    <!-- subtle warm wash on the right (orange, low, so it doesn't go green) -->
    <radialGradient id="warm" cx="88%" cy="46%" r="50%">
      <stop offset="0" stop-color="#FF8A1E" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FF8A1E" stop-opacity="0"/>
    </radialGradient>
    <!-- cheap soft glow for the dots (radial fill, no blur filter) -->
    <radialGradient id="dotFill" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE0A0"/>
      <stop offset="0.4" stop-color="#FFC15E"/>
      <stop offset="1" stop-color="#FFC15E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect width="1440" height="900" fill="url(#warm)"/>

  <!-- asymmetric glowing orbs: a varied cluster top-left + one offset accent lower-right -->
  <g>
    <circle cx="150" cy="190" r="135" fill="url(#dotFill)" opacity="0.24"/>
    <circle cx="270" cy="120" r="52" fill="url(#dotFill)" opacity="0.36"/>
    <circle cx="95" cy="340" r="78" fill="url(#dotFill)" opacity="0.20"/>
    <circle cx="320" cy="270" r="30" fill="url(#dotFill)" opacity="0.42"/>
    <circle cx="1200" cy="720" r="150" fill="url(#dotFill)" opacity="0.20"/>
    <circle cx="1320" cy="630" r="44" fill="url(#dotFill)" opacity="0.34"/>
  </g>

  <!-- converging lines over the gradient; meet off-screen right (leaving the screen) -->
  <g fill="none" stroke="#AECBF0" stroke-width="1" stroke-linecap="round" opacity="0.35">
    <path id="p1" d="M-40 160 C 520 220, 980 380, 1620 450"/>
    <path id="p2" d="M-40 280 C 520 310, 980 410, 1620 450"/>
    <path id="p3" d="M-40 380 C 520 395, 980 432, 1620 450"/>
    <path id="p4" d="M-40 470 C 520 462, 980 456, 1620 450"/>
    <path id="p5" d="M-40 560 C 520 540, 980 484, 1620 450"/>
    <path id="p6" d="M-40 660 C 520 610, 980 505, 1620 450"/>
    <path id="p7" d="M-40 760 C 520 700, 980 545, 1620 450"/>
  </g>

  <!-- orange dots glide steadily along the lines (constant size/opacity = no flicker) -->
  <g fill="url(#dotFill)">
    <g><circle r="8"/><animateMotion dur="9s"  begin="0s"   repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#p1"/></animateMotion></g>
    <g><circle r="8"/><animateMotion dur="10.5s" begin="1.3s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#p2"/></animateMotion></g>
    <g><circle r="8"/><animateMotion dur="9.5s" begin="2.6s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#p3"/></animateMotion></g>
    <g><circle r="9"/><animateMotion dur="11s"  begin="0.6s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#p4"/></animateMotion></g>
    <g><circle r="8"/><animateMotion dur="10s"  begin="2s"   repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#p5"/></animateMotion></g>
    <g><circle r="8"/><animateMotion dur="10.8s" begin="1s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#p6"/></animateMotion></g>
    <g><circle r="8"/><animateMotion dur="12s"  begin="0.3s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#p7"/></animateMotion></g>
  </g>
</svg>
