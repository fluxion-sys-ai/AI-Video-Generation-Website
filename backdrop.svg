<svg width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- dark on the left, lighter + warmer toward the right -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#060A13"/>
      <stop offset="0.45" stop-color="#0D1728"/>
      <stop offset="0.78" stop-color="#1A2A44"/>
      <stop offset="1" stop-color="#2E3552"/>
    </linearGradient>
    <!-- warm wash on the right (the yellower feel) -->
    <radialGradient id="warm" cx="90%" cy="50%" r="55%">
      <stop offset="0" stop-color="#E8B24E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8B24E" stop-opacity="0"/>
    </radialGradient>
    <!-- cheap soft glow for the dots (radial fill, no blur filter) -->
    <radialGradient id="dotFill" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE0A0"/>
      <stop offset="0.4" stop-color="#FFC15E"/>
      <stop offset="1" stop-color="#FFC15E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect width="1440" height="900" fill="url(#warm)"/>

  <!-- converging lines over the gradient; meet off-screen right (leaving the screen) -->
  <g fill="none" stroke="#AECBF0" stroke-width="1" stroke-linecap="round" opacity="0.35">
    <path id="p1" d="M-40 160 C 520 220, 980 380, 1620 450"/>
    <path id="p2" d="M-40 280 C 520 310, 980 410, 1620 450"/>
    <path id="p3" d="M-40 380 C 520 395, 980 432, 1620 450"/>
    <path id="p4" d="M-40 470 C 520 462, 980 456, 1620 450"/>
    <path id="p5" d="M-40 560 C 520 540, 980 484, 1620 450"/>
    <path id="p6" d="M-40 660 C 520 610, 980 505, 1620 450"/>
    <path id="p7" d="M-40 760 C 520 700, 980 545, 1620 450"/>
  </g>

  <!-- orange dots: grow + brighten as they accelerate toward the right -->
  <g fill="url(#dotFill)">
    <g>
      <circle r="3"><animate attributeName="r" values="5;7;11" keyTimes="0;0.6;1" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="5.5s" repeatCount="indefinite"/></circle>
      <animateMotion dur="5.5s" begin="0s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p1"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="5;7;11" keyTimes="0;0.6;1" dur="6.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="6.2s" repeatCount="indefinite"/></circle>
      <animateMotion dur="6.2s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p2"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="5;7;11" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/></circle>
      <animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p3"/></animateMotion>
    </g>
    <g>
      <circle r="3.4"><animate attributeName="r" values="5.5;7.5;12" keyTimes="0;0.6;1" dur="6.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.85;1" keyTimes="0;0.6;1" dur="6.6s" repeatCount="indefinite"/></circle>
      <animateMotion dur="6.6s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p4"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="5;7;11" keyTimes="0;0.6;1" dur="5.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="5.8s" repeatCount="indefinite"/></circle>
      <animateMotion dur="5.8s" begin="2.1s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p5"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="5;7;11" keyTimes="0;0.6;1" dur="6.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="6.4s" repeatCount="indefinite"/></circle>
      <animateMotion dur="6.4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p6"/></animateMotion>
    </g>
    <g>
      <circle r="3"><animate attributeName="r" values="5;7;11" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.45;0.8;1" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/></circle>
      <animateMotion dur="7s" begin="0.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 1 1"><mpath xlink:href="#p7"/></animateMotion>
    </g>
  </g>
</svg>
